<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Matches --bg-2: the app has been light since the dark theme read
         "ילדותי". A dark theme-color here would tint the phone's status bar
         near-black over a white app underneath it. -->
    <meta name="theme-color" content="#FAFAFB" />
    <title>TripAI — עוזר הנסיעות שלך</title>

    <!-- The card WhatsApp/iMessage/etc. show when a trip link gets shared —
         the app's own "share the trip" feature depends on this not looking
         like a broken link. og-image.png is generated, not hand-drawn: see
         scripts/build-og-image.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TripAI" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:url" content="https://travel-ai-6de47.web.app" />
    <meta property="og:title" content="TripAI — עוזר הנסיעות שלך" />
    <meta property="og:description" content="תכנון טיולים חכם, בעברית. ספר לנו לאן, מתי ועם מי — והסוכן יבנה מסלול יומי מלא, ימקם אותו על המפה, וידאג שכולם מסונכרנים לאורך כל הדרך." />
    <meta property="og:image" content="https://travel-ai-6de47.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TripAI — עוזר הנסיעות שלך" />
    <meta name="twitter:description" content="תכנון טיולים חכם, בעברית" />
    <meta name="twitter:image" content="https://travel-ai-6de47.web.app/og-image.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- iOS ignores the manifest entirely for "הוסף למסך הבית" — this is the
         only icon reference it reads. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TripAI" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&family=Heebo:wght@300;400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
