name = "tripai-ai"
main = "index.js"
compatibility_date = "2025-01-01"

# Only these origins may call the proxy. Anything else is refused before the
# request ever reaches Gemini, so a leaked worker URL is not a usable key.
[vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173,https://travel-ai-6de47.web.app,https://travel-ai-6de47.firebaseapp.com"

# GEMINI_API_KEY (and the optional GEMINI_API_KEY_2 … _8, for rotating
# across more than one free-tier key/project) are secrets, never vars:
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put GEMINI_API_KEY_2
#
# Optional — live web search for "what's the price/is it open now" questions,
# via Tavily's free tier (1,000 searches/month PER ACCOUNT, no card). More
# accounts each add their own 1,000: TAVILY_API_KEY_2 … TAVILY_API_KEY_5.
#   wrangler secret put TAVILY_API_KEY

# Last-resort fallback when every Gemini key/model is out of quota.
[ai]
binding = "AI"
